<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DocuPulse</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c101c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Icons live in branding/ so they can be replaced after deployment (see branding/README.txt) -->
    <link rel="icon" type="image/svg+xml" href="branding/favicon.svg" />
    <link rel="icon" sizes="48x48" href="branding/favicon.ico" />
    <link rel="apple-touch-icon" href="branding/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Saved theme and light/dark choice, applied before the app loads (see core/theme.ts) -->
    <script src="theme-boot.js"></script>
    <!-- Where the API server is; edit config.js after deploying, no rebuild needed -->
    <script src="config.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use DocuPulse.</noscript>
  </body>
</html>
