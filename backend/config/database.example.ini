; IDP database settings.
; Copy this file to database.ini (the server does that itself on first start) and set `engine`.
; On start the server connects; if the tables are missing it runs db/schema/<engine>.sql once.
; If the tables already exist it leaves the database alone.
;
; Any value can also come from an environment variable, which wins over this file:
;   IDP_DB_ENGINE, IDP_DB_HOST, IDP_DB_PORT, IDP_DB_NAME, IDP_DB_USER, IDP_DB_PASSWORD, IDP_DB_PATH
; Keeping the password in IDP_DB_PASSWORD (not in this file) is recommended.

[database]
; sqlite | postgresql | sqlserver
engine = sqlite

[sqlite]
; Relative paths are inside backend/storage
path = idp_saas.db

[postgresql]
; Needs the psycopg driver:  pip install "psycopg[binary]"
host = db-server.corp.local
port = 5432
name = idp
user = idp_app
password =
; disable | prefer | require | verify-full
sslmode = prefer

[sqlserver]
; Needs the pymssql driver:  pip install pymssql   (no ODBC driver required)
host = sql-server.corp.local
port = 1433
name = idp
user = idp_app
password =
; For a named instance use host = server\INSTANCE and leave port empty
