; DocuPulse IDP sign-in settings, read at every server start.
; Copied to auth.ini on first start; edit auth.ini and restart the service.
;
; mode = local  : usernames and passwords managed in the app (default)
; mode = ldap   : Active Directory / LDAP, fill in [ldap]
; mode = okta   : Okta single sign-on, fill in [okta]
; mode = ui     : this file is ignored; administrators choose the method in Admin Settings → Users & Sign-in
;
; With local, ldap or okta, this file wins: at each start it sets the sign-in method and the [okta] / [ldap]
; settings, and Admin Settings shows them read-only. The local 'admin' account always keeps working as
; a backup login, whatever the mode.
;
; Secrets: put them in environment variables rather than here (they override this file):
;   IDP_OKTA_CLIENT_SECRET, IDP_LDAP_BIND_PASSWORD
; Any other key can also be overridden: IDP_AUTH_MODE, IDP_OKTA_<KEY>, IDP_LDAP_<KEY> (e.g. IDP_LDAP_SERVER_URL).

[signin]
mode = local

[okta]
; e.g. https://yourcompany.okta.com/oauth2/default
issuer =
client_id =
client_secret =
; The API's public address + /api/auth/okta/callback; must match the Okta app exactly
redirect_uri =
scopes = openid profile email groups
groups_claim = groups

[ldap]
; ldaps://dc01.corp.local:636 (recommended) or ldap://dc01.corp.local:389 with use_starttls = true
server_url =
use_starttls = false
verify_tls = true
; Your internal CA certificate (PEM), if the directory's certificate is not publicly trusted
ca_cert_path =
; Service account used to look people up, e.g. CN=svc-idp,OU=Service Accounts,DC=corp,DC=local
bind_dn =
bind_password =
user_base_dn =
user_filter = (&(objectClass=user)(sAMAccountName={username}))
group_attribute = memberOf
nested_groups = true
timeout = 8

[roles]
; Optional. Directory / Okta group = role (admin or user). When this section lists any group, the file
; also manages group roles; otherwise they are edited in Admin Settings.
; IDP-Admins = admin
; IDP-Users = user
;
; Role for people in no listed group: user, admin, or none (refused). Empty: keep the Admin Settings choice.
default_role =
