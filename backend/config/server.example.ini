; IDP API server settings.
; Copied to server.ini on first start; edit server.ini. Environment variables (shown in brackets) win over this file.
; The database is configured separately in database.ini.

[server]
; Address and port the API listens on. 0.0.0.0 accepts connections from other machines.   [IDP_HOST, IDP_PORT]
host = 127.0.0.1
port = 8000
; Auto-reload on code changes (development only).                                          [IDP_RELOAD]
reload = false

[frontend]
; true: this server also serves the web UI from dist_dir (single-server mode).             [IDP_SERVE_FRONTEND]
; false: the UI is deployed separately (any web server / CDN-less static host on the intranet).
serve_frontend = true
dist_dir = ../frontend/dist
; Where the UI lives when it is deployed separately; users return there after Okta sign-in. [IDP_FRONTEND_URL]
frontend_url =

[cors]
; Origins (scheme://host:port) of separately deployed UIs allowed to call this API with
; sign-in cookies. Comma-separated. Not needed in single-server mode.                       [IDP_CORS_ORIGINS]
allowed_origins =

[session]
; Sign-in session lifetime in hours.                                                       [IDP_SESSION_HOURS]
hours = 12
; Cookie SameSite: lax works when UI and API share a site (e.g. idp.corp.local and api.corp.local).
; Use none (requires HTTPS, secure = true) only if UI and API are on unrelated domains.    [IDP_COOKIE_SAMESITE]
cookie_samesite = lax
; auto: Secure flag when the request came over HTTPS. true / false to force.               [IDP_COOKIE_SECURE]
cookie_secure = auto

[storage]
; Uploaded files, page images and (for SQLite) the database. Relative to backend/.         [IDP_STORAGE_DIR]
dir = storage
; Largest upload in MB, and most pages processed per document.                             [IDP_MAX_UPLOAD_MB, IDP_MAX_PAGES]
max_upload_mb = 25
max_pages = 500

[logging]
; app.log: operations and errors. audit.log: sign-ins, admin changes, document deletes and moves.
; Both rotate at max_mb, keeping `backups` old files. No passwords, tokens or document text are logged.
; format: json (one JSON object per line, for Splunk/ELK/Graylog) or text.                 [IDP_LOG_DIR, IDP_LOG_LEVEL, ...]
dir = storage/logs
level = INFO
format = json
max_mb = 20
backups = 10
; One line per HTTP request (method, path, status, time, user, client address).            [IDP_LOG_ACCESS]
access_log = true

[security]
; Reverse proxies allowed to set X-Forwarded-For / X-Forwarded-Proto (comma-separated IPs).  [IDP_TRUSTED_PROXIES]
; Keep 127.0.0.1 when nginx runs on this machine; add the proxy's address otherwise (Docker: its network IP).
trusted_proxies = 127.0.0.1
; Sign-in lockout: failures per username before a pause of login_lockout_minutes, and per client address.
login_max_failures = 5
login_lockout_minutes = 15
login_max_failures_per_ip = 30
; Minimum length for local passwords.                                                       [IDP_PASSWORD_MIN_LENGTH]
password_min_length = 12
; Encryption key for stored secrets (Okta client secret, directory bind password).          [IDP_SECRET_KEY]
; Leave empty to use secret_key_file, created on first start (keep it out of backups shared with others).
secret_key =
secret_key_file = storage/secret.key
; Content-Security-Policy for pages this server sends. Empty = built-in strict policy.       [IDP_CSP]
content_security_policy =

[features]
; Instant demo: sample-document buttons on the dashboard and in Upload, the /documents/sample API,
; and three demo documents added to an empty database. Off for production.            [IDP_DEMO_PRESETS]
demo_presets = false

[extraction]
; Documents whose overall confidence is below this go to review.                           [IDP_REVIEW_THRESHOLD]
review_threshold = 0.85

[local_llm]
; Optional OpenAI-compatible LLM on your own network (e.g. http://llm01:11434/v1). Empty = off.  [LOCAL_LLM_URL]
url =
model = llama3.1:8b
timeout = 60
max_chars = 12000
